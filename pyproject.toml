[project]
name = "soundspace-ui"
version = "0.1.0"
description = "Soundspace UI | An Interactive Semantic Space of Musical Affect."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "essentia==2.1b6.dev1389",
    "essentia-tensorflow==2.1b6.dev1389",
    "fastapi[standard]>=0.136.3",
    "httpx>=0.28.1",
    "igraph>=1.0.0",
    "leidenalg>=0.12.0",
    "librosa>=0.11.0",
    "muq>=0.1.0",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.5",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "tqdm>=4.67.3",
    "transformers>=5.9.0",
    "typer>=0.26.6",
    "umap-learn>=0.5.12",
]

[project.scripts]
soundspace = "soundspace.cli.main:main"

[dependency-groups]
dev = [
    "ruff>=0.15.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soundspace"]
